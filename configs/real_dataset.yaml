data:
  train_csv: data/real_dataset/train.csv
  val_csv: data/real_dataset/val.csv
  test_csv: data/real_dataset/test.csv
  image_root: data/real_dataset/images
  batch_size: 64
  num_workers: 8

model:
  pretrained: true
  dropout: 0.3

training:
  epochs: 100
  backbone_lr: 0.00001
  head_lr: 0.0001
  weight_decay: 0.0001
  lambda_vad: 0.5
  mixed_precision: true
  gradient_accumulation_steps: 1
  save_dir: checkpoints_real
  save_every: 5
