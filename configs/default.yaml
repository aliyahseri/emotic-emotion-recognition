data:
  train_csv: data/annotations/train.csv
  val_csv: data/annotations/val.csv
  test_csv: data/annotations/test.csv
  image_root: data/raw/emotic/emotic
  batch_size: 32
  num_workers: 4

model:
  pretrained: true
  dropout: 0.3

training:
  epochs: 50
  lambda_vad: 0.5
  backbone_lr: 0.00001
  head_lr: 0.0001
  weight_decay: 0.0001
  save_dir: checkpoints
  save_every: 5
  mixed_precision: false
  gradient_accumulation_steps: 1
