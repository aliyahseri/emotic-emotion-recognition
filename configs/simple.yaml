data:
  train_csv: data/annotations/train.csv
  val_csv: data/annotations/val.csv
  test_csv: data/annotations/test.csv
  image_root: data/raw/emotic/emotic
  batch_size: 16
  num_workers: 2

model:
  pretrained: true
  dropout: 0.5

training:
  epochs: 10
  lambda_vad: 0.5
  learning_rate: 0.0001
  weight_decay: 0.0001
  save_dir: checkpoints
  save_every: 2
